<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détail patient - MediLabo Solutions</title>
</head>
<body>
<h1 th:text="${patient.firstName} + ' ' + ${patient.lastName}"></h1>

<form th:action="@{/patients/{id}/edit(id=${patient.id})}" method="get">
    <button type="submit">Modifier ce patient</button>
</form>

<p>
    <strong>Niveau de risque de diabète :</strong>
    <span th:text="${risk.risk}"></span>
</p>

<ul>
    <li>Date de naissance : <span th:text="${patient.dateOfBirth}"></span></li>
    <li>Genre : <span th:text="${patient.gender}"></span></li>
    <li>Adresse : <span th:text="${patient.address}"></span></li>
    <li>Téléphone : <span th:text="${patient.phone}"></span></li>
</ul>

<h2>Notes du médecin</h2>
<div th:each="n : ${notes}" style="border:1px solid #ccc; margin-bottom:10px; padding:8px;">
    <p th:text="${n.note}" style="white-space: pre-wrap;"></p>
    <form th:action="@{/patients/{patId}/notes/{noteId}/delete(patId=${patient.id}, noteId=${n.id})}" method="post"
          onsubmit="return confirm('Supprimer cette note ?');">
        <button type="submit">Supprimer la note</button>
    </form>
</div>

<h3>Ajouter une note</h3>
<form th:action="@{/patients/{id}/notes(id=${patient.id})}" method="post">
    <input type="hidden" name="patient" th:value="${patient.lastName}" />
    <textarea name="note" rows="5" cols="50" required></textarea><br/>
    <button type="submit">Ajouter la note</button>
</form>

<form th:action="@{/patients/{id}/delete(id=${patient.id})}" method="post"
      onsubmit="return confirm('Supprimer ce patient ? Cette action est irréversible.');">
    <button type="submit">Supprimer ce patient</button>
</form>

<form th:action="@{/patients}" method="get">
    <button type="submit">Retour à la liste</button>
</form>
</body>
</html>
