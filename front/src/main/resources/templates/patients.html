<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patients - MediLabo Solutions</title>
</head>
<body>
<h1>Liste des patients</h1>

<form th:action="@{/patients/new}" method="get">
    <button type="submit">+ Ajouter un patient</button>
</form>

<table border="1" cellpadding="6">
    <tr>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Date de naissance</th>
        <th>Genre</th>
        <th></th>
        <th></th>
    </tr>
    <tr th:each="patient : ${patients}">
        <td th:text="${patient.lastName}"></td>
        <td th:text="${patient.firstName}"></td>
        <td th:text="${patient.dateOfBirth}"></td>
        <td th:text="${patient.gender}"></td>
        <td>
            <form th:action="@{/patients/{id}(id=${patient.id})}" method="get">
                <button type="submit">Détail</button>
            </form>
        </td>
        <td>
            <form th:action="@{/patients/{id}/delete(id=${patient.id})}" method="post"
                  onsubmit="return confirm('Supprimer ce patient ?');">
                <button type="submit">Supprimer</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
