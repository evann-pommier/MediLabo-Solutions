# Profil "docker" : redéfinit intégralement les 3 routes avec les noms de
# services Docker Compose (patient-service, notes-service, risk-service)
# au lieu de "localhost".
#
# Chaque route est redéfinie en entier (id + uri + predicates + filters)
# plutôt que de ne surcharger que l'uri via une variable d'environnement :
# Spring Boot ne fusionne pas les propriétés d'un même élément de liste
# indexée venant de deux sources différentes (ici, application.properties
# embarqué dans le jar vs variables d'environnement du conteneur). Un
# fichier de profil unique évite ce piège en gardant toutes les propriétés
# d'une même route dans une seule source.

spring.cloud.gateway.server.webflux.routes[0].id=patient-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://patient-service:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/patients/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=AddRequestHeader=Authorization, Basic Z2F0ZXdheTpnYXRld2F5LXB3ZA==

spring.cloud.gateway.server.webflux.routes[1].id=notes-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://notes-service:8083
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/notes/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=AddRequestHeader=Authorization, Basic Z2F0ZXdheTpnYXRld2F5LXB3ZA==

spring.cloud.gateway.server.webflux.routes[2].id=risk-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://risk-service:8084
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/assess/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=AddRequestHeader=Authorization, Basic Z2F0ZXdheTpnYXRld2F5LXB3ZA==