spring.application.name=gateway

server.port=8080

# Route vers patient-service : toute requête entrante commençant par
# /patients/** est redirigée vers le port 8081. Le filtre AddRequestHeader
# injecte automatiquement les identifiants HTTP Basic (utilisateur "gateway")
# à chaque requête sortante, sans que le front ait à les connaître.
spring.cloud.gateway.server.webflux.routes[0].id=patient-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/patients/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=AddRequestHeader=Authorization, Basic Z2F0ZXdheTpnYXRld2F5LXB3ZA==

# Route vers notes-service : même principe pour les chemins /notes/**.
spring.cloud.gateway.server.webflux.routes[1].id=notes-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/notes/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=AddRequestHeader=Authorization, Basic Z2F0ZXdheTpnYXRld2F5LXB3ZA==

# Route vers risk-service : même principe pour les chemins /assess/**.
# Note : risk-service appelle lui-même patient-service et notes-service
# directement (sans repasser par cette gateway) ; cette route ne sert
# qu'à exposer /assess/** au front.
spring.cloud.gateway.server.webflux.routes[2].id=risk-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/assess/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=AddRequestHeader=Authorization, Basic Z2F0ZXdheTpnYXRld2F5LXB3ZA==